# Join the program, end to end in Expo Go, on iOS or Android, in English or Spanish:
#   iOS:     maestro test -e APP_ID=host.exp.Exponent -e APP_URL=exp://127.0.0.1:8081 .maestro/join.yaml
#   Android: adb reverse tcp:8081 tcp:8081, then the same with APP_ID=host.exp.exponent
# Turn the Face ID lock off first, or the app opens on the lock screen. No hideKeyboard: on
# Android it presses back when no keyboard is up, which leaves Expo Go. Tapping the intro
# text closes the keyboard on both platforms.
appId: ${APP_ID}
---
- openLink: ${APP_URL}/--/join
- extendedWaitUntil:
    visible: "Join the program|Únete al programa|Continue|Close"
    timeout: 40000
# Expo Go's developer menu can open on a fresh install
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- extendedWaitUntil:
    visible:
      id: join-submit
    timeout: 30000
# 1. Empty submit: every error at once
- tapOn:
    id: join-submit
- extendedWaitUntil:
    visible:
      id: join-terms-error
    timeout: 5000
# 2. Fill it, with the email the mock already knows
- tapOn:
    id: join-name
# A fresh Android emulator's keyboard (Gboard) opens a stylus tutorial on the first field
# it focuses, and that tutorial takes the typing. Close it and focus the field again.
- runFlow:
    when:
      visible: "Try out your stylus"
    commands:
      - tapOn: "Cancel"
      - tapOn:
          id: join-name
- inputText: "Ana Lopez"
- tapOn:
    id: join-email
- inputText: "taken@example.com"
- tapOn: "Earn points.*|Gana puntos.*"
- scrollUntilVisible:
    element:
      id: join-terms
- tapOn:
    id: join-terms
- scrollUntilVisible:
    element:
      id: join-submit
- tapOn:
    id: join-submit
- scrollUntilVisible:
    element:
      id: join-email
    direction: UP
- extendedWaitUntil:
    visible:
      id: join-email-error
      text: "This email is already registered.|Este correo ya está registrado."
    timeout: 8000
# 3. Fix the email and join
- tapOn:
    id: join-email
- eraseText: 30
- inputText: "ana@example.com"
- tapOn: "Earn points.*|Gana puntos.*"
- scrollUntilVisible:
    element:
      id: join-submit
- tapOn:
    id: join-submit
- extendedWaitUntil:
    visible:
      id: join-success
    timeout: 8000
