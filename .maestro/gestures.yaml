# Gestures demo, end to end in Expo Go, on iOS or Android, in English or Spanish:
#   iOS:     maestro test -e APP_ID=host.exp.Exponent -e APP_URL=exp://127.0.0.1:8081 .maestro/gestures.yaml
#   Android: adb reverse tcp:8081 tcp:8081, then the same with APP_ID=host.exp.exponent
# Swipes need a duration of 400 ms or more: shorter ones do not move in the simulator.
# Pinch and rotate cannot be driven from Maestro; unit tests cover them.
appId: ${APP_ID}
---
- openLink: ${APP_URL}/--/gestures
- extendedWaitUntil:
    visible: "Gestures|Gestos|Continue|Close"
    timeout: 40000
# Expo Go's developer menu can open on a fresh install
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- scrollUntilVisible:
    element:
      id: gestures-heading
    direction: UP
    timeout: 30000
# 1. Drag the card; it springs back, so the screen is as it was
- assertVisible:
    id: gestures-drag-card
- swipe:
    from:
      id: gestures-drag-card
    direction: RIGHT
    duration: 600
- assertVisible:
    id: gestures-drag-card
# 2. Swipe a row left to delete it; the vertical scroll still works to get there
- repeat:
    while:
      notVisible:
        id: gestures-row-0
    times: 12
    commands:
      - swipe:
          start: 4%, 75%
          end: 4%, 25%
          duration: 400
- swipe:
    from:
      id: gestures-row-0
    direction: LEFT
    duration: 600
- extendedWaitUntil:
    notVisible:
      id: gestures-row-0
    timeout: 10000
# The counter and Restore sit below the rows: bring Restore to the middle of the screen, so a tap
# reaches it (iOS reports an element just under the bottom edge as visible)
- scrollUntilVisible:
    element:
      id: gestures-restore
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible: ".*: 7 (of|de) 8"
# 3. Restore rows brings it back
- tapOn:
    id: gestures-restore
- assertVisible: ".*: 8 (of|de) 8"
- repeat:
    while:
      notVisible:
        id: gestures-row-0
    times: 12
    commands:
      - swipe:
          start: 4%, 25%
          end: 4%, 75%
          duration: 400
- assertVisible:
    id: gestures-row-0
# 4. Block the JavaScript thread; the app comes back and says so. The squares stay still: the flow
# never presses Animate, since Android's uiautomator cannot read a screen whose views keep moving.
- scrollUntilVisible:
    element:
      id: gestures-block-js
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: gestures-block-js
- extendedWaitUntil:
    visible: ".*(JavaScript was blocked|JavaScript estuvo bloqueado).*"
    timeout: 20000
