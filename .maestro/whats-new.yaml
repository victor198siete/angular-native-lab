# What's new demo, end to end in Expo Go, on iOS or Android, in English or Spanish:
#   iOS:     xcrun simctl terminate booted host.exp.Exponent, then
#            maestro test -e APP_ID=host.exp.Exponent -e APP_URL=exp://127.0.0.1:8081 .maestro/whats-new.yaml
#   Android: adb reverse tcp:8081 tcp:8081, then the same with APP_ID=host.exp.exponent
# Start with Expo Go closed: a link to the screen already showing does nothing, and the deep-link
# case below needs the app running when the second link arrives.
# Covers the interactive 0.10 cases: Dialogs.choose (Cancel resolves null, Save an index), the dark
# class on a root view, and a deep link pushed over the screen. The style cases (::ng-deep, border
# colour, one word, z-index) are visual: their screenshots are the evidence, Maestro cannot read them.
# The end of the file covers 0.13 (the icon readouts, the loader, the aria-label, and Back refused on a
# presented page on Android) and 0.11 (the two tab cases, in the tabs lab: Search behind a 4 s guard, and a
# tab bar moved from org 1 to org 2). The 0.13 and 0.11 drawings, and A11-1 (it leaves the app), are screenshots.
appId: ${APP_ID}
---
- openLink: ${APP_URL}/--/whats-new
- extendedWaitUntil:
    visible: "What's new|Novedades|Continue|Close"
    timeout: 40000
# Expo Go's developer menu can open on a fresh install
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
# 1. The list of versions, and a row opens the 0.10 cases
- assertVisible:
    id: whats-new-heading
- tapOn:
    id: whats-new-version-0.10
- extendedWaitUntil:
    visible:
      id: whats-new-version-heading
    timeout: 20000
- assertVisible:
    id: whats-new-a10-1-status
# 2. Dialogs.choose: Cancel resolves null, Save the index 0
- scrollUntilVisible:
    element:
      id: whats-new-a10-1-open
    centerElement: true
- tapOn:
    id: whats-new-a10-1-open
- tapOn: "Cancel|Cancelar"
- assertVisible: "Resolved: null|Resuelto: null"
- tapOn:
    id: whats-new-a10-1-open
- tapOn: "Save|Guardar"
- assertVisible: "Resolved: 0|Resuelto: 0"
# 3. The dark class on the box itself
- scrollUntilVisible:
    element:
      id: whats-new-a10-4-toggle
    centerElement: true
- assertVisible: "dark class: off.*|clase dark: inactiva.*"
- tapOn:
    id: whats-new-a10-4-toggle
- assertVisible: "dark class: on.*|clase dark: activa.*"
- tapOn:
    id: whats-new-a10-4-toggle
- assertVisible: "dark class: off.*|clase dark: inactiva.*"
# 4. A link that arrives while the app runs is pushed over this screen; Back returns to it
- openLink: ${APP_URL}/--/device
- extendedWaitUntil:
    visible: "Your device, live|Tu dispositivo, en vivo"
    timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Version 0.10|Versión 0.10"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: whats-new-a10-4-toggle
    timeout: 20000
# 5. The 0.9 cases, opened by a link pushed over this screen (a link to the screen already showing does nothing)
- openLink: ${APP_URL}/--/whats-new/0.9
- extendedWaitUntil:
    visible:
      id: whats-new-a9-1-show
    timeout: 30000
# A9-1: the ICU sample is mounted on a press and, in Expo Go in development, throws while it renders:
# its texts never appear, so this flow does not assert them (the Vitest tests do).
# A9-2: both squares start from a press and stop at their own last frame
- scrollUntilVisible:
    element:
      id: whats-new-a9-2-toggle
    centerElement: true
- tapOn:
    id: whats-new-a9-2-toggle
- extendedWaitUntil:
    visible: "Reset|Reiniciar"
    timeout: 20000
# A9-3: each panel opens to the height set on it: 40, 96 and 64 points
- scrollUntilVisible:
    element:
      id: whats-new-a9-3-toggle
    centerElement: true
- tapOn:
    id: whats-new-a9-3-toggle
- extendedWaitUntil:
    visible: "Measured: 40 / 96 / 64|Medido: 40 / 96 / 64"
    timeout: 20000
# A9-4: after the fade, a press on the button still counts (iOS)
- scrollUntilVisible:
    element:
      id: whats-new-a9-4-count
    centerElement: true
- tapOn:
    id: whats-new-a9-4-fade
- extendedWaitUntil:
    visible: "Presses heard: 0 .faded.|Pulsaciones oídas: 0 .desvanecido."
    timeout: 20000
- tapOn:
    id: whats-new-a9-4-target
- assertVisible: "Presses heard: 1 .faded.|Pulsaciones oídas: 1 .desvanecido."
# A9-5: the cards mount through an @if (the last card: its button cannot be centred at the scroll's end)
- scrollUntilVisible:
    element:
      id: whats-new-a9-5-toggle
- tapOn:
    id: whats-new-a9-5-toggle
- extendedWaitUntil:
    visible:
      id: whats-new-a9-5-fast
    timeout: 20000
# 6. The 0.8 cases, opened by another pushed link
- openLink: ${APP_URL}/--/whats-new/0.8
- extendedWaitUntil:
    visible:
      id: whats-new-a8-1-check
    timeout: 30000
# A8-1: the permission is read with no dialog (Expo Go on the simulator has it granted or not; the
# Settings round trip needs simctl / adb and is in the README, not here)
- tapOn:
    id: whats-new-a8-1-check
- assertVisible: "Permission: .*|Permiso: .*"
# A8-2: the transitions are 10 s and are judged from a screen recording, not from this flow
# A8-3: padding and margin end at 20 after Open (a 2 s transition)
- scrollUntilVisible:
    element:
      id: whats-new-a8-3-toggle
    centerElement: true
- tapOn:
    id: whats-new-a8-3-toggle
- extendedWaitUntil:
    visible: "Padding 20 / margin 20"
    timeout: 20000
# A8-4: the middle stop moves with the buttons
- scrollUntilVisible:
    element:
      id: whats-new-a8-4-less
    centerElement: true
- tapOn:
    id: whats-new-a8-4-less
- tapOn:
    id: whats-new-a8-4-less
- assertVisible: "Middle stop at 10%|Parada intermedia en 10%"
# A8-5: the four icons are drawn at 18, 24, 24 and 16 points
- scrollUntilVisible:
    element:
      id: whats-new-a8-5-readout
    centerElement: true
- assertVisible: "Drawn: 18 / 24 / 24 / 16 points|Dibujados: 18 / 24 / 24 / 16 puntos"
# A8-6: the swatch follows the scheme (the last card: no centring at the scroll's end)
- scrollUntilVisible:
    element:
      id: whats-new-a8-6-readout
- assertVisible: "Scheme: light.*|Esquema: claro.*"
# 7. The 0.13 cases, opened by another pushed link
- openLink: ${APP_URL}/--/whats-new/0.13
- extendedWaitUntil:
    visible:
      id: whats-new-a13-2-next
    timeout: 30000
# A13-2: the pin follows --accent
- scrollUntilVisible:
    element:
      id: whats-new-a13-2-next
    centerElement: true
- tapOn:
    id: whats-new-a13-2-next
- assertVisible: "--accent is #0369a1|--accent es #0369a1"
# A13-3: the config gives 28 points, the icon's own size 44
- scrollUntilVisible:
    element:
      id: whats-new-a13-3-readout
    centerElement: true
- assertVisible: "Drawn: 28 / 44 points|Dibujados: 28 / 44 puntos"
# A13-4: the loader is asked once per name, and not again on a second draw
- scrollUntilVisible:
    element:
      id: whats-new-a13-4-draw
    centerElement: true
- tapOn:
    id: whats-new-a13-4-draw
- extendedWaitUntil:
    visible: "Loader asked 2 times: loaded-pin, loaded-ring|Cargador consultado 2 veces: loaded-pin, loaded-ring"
    timeout: 20000
- tapOn:
    id: whats-new-a13-4-clear
- tapOn:
    id: whats-new-a13-4-draw
- assertVisible: "Loader asked 2 times: loaded-pin, loaded-ring|Cargador consultado 2 veces: loaded-pin, loaded-ring"
# A13-5: the static aria-label is what a screen reader (and Maestro) finds
- scrollUntilVisible:
    element:
      id: whats-new-a13-5-labelled
    centerElement: true
- assertVisible: "Pin on the map"
# A13-6: 32 points from --ng-icon__size, 16 from the text
- scrollUntilVisible:
    element:
      id: whats-new-a13-6-readout
    centerElement: true
- assertVisible: "Drawn: 32 / 16 points|Dibujados: 32 / 16 puntos"
# A13-1 and A13-7 are drawings: their screenshots are the evidence
# A13-8: the lab is a pushed tab bar; on Android Back is refused on the presented page (the last card: no centring)
- scrollUntilVisible:
    element:
      id: whats-new-a13-8-open
- tapOn:
    id: whats-new-a13-8-open
- extendedWaitUntil:
    visible:
      id: whats-new-lab-present
    timeout: 20000
- tapOn:
    id: whats-new-lab-present
- extendedWaitUntil:
    visible: "Album guarded"
    timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - assertVisible: "Back refused: 1"
- tapOn:
    id: whats-new-lab-album-close
- extendedWaitUntil:
    visible:
      id: whats-new-lab-leave
    timeout: 20000
- tapOn:
    id: whats-new-lab-leave
- extendedWaitUntil:
    visible:
      id: whats-new-a13-8-open
    timeout: 20000
# 8. The 0.11 cases: the two tab cases run in the lab
- openLink: ${APP_URL}/--/whats-new/0.11
- extendedWaitUntil:
    visible:
      id: whats-new-a11-1-open
    timeout: 30000
# A11-1 opens the system Settings and leaves the app: the Vitest test and the README cover it
- scrollUntilVisible:
    element:
      id: whats-new-a11-2-open
    centerElement: true
- tapOn:
    id: whats-new-a11-2-open
- extendedWaitUntil:
    visible:
      id: whats-new-lab-home-title
    timeout: 20000
# A11-2: Search waits 4 s behind a guard; a tap on Home at once keeps Home in front
- tapOn: "Search"
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Tabs lab: Search"
    timeout: 6500
    optional: true
- assertNotVisible: "Tabs lab: Search"
- assertVisible: "url: /whats-new/tabs/1/home"
# A11-3: the url of a tab goes to the account in front (the page left behind in the stack is the caveat)
- tapOn: "Library"
- tapOn:
    id: whats-new-lab-open-x
- extendedWaitUntil:
    visible:
      id: whats-new-lab-album-title
    timeout: 10000
- tapOn: "Home"
- tapOn:
    id: whats-new-lab-org
- extendedWaitUntil:
    visible: "org: 2"
    timeout: 10000
- tapOn: "Library"
- extendedWaitUntil:
    visible: "url: /whats-new/tabs/2/library"
    timeout: 10000
# 9. The 0.14 cases, opened by another pushed link. The layout cases (A14-4 to A14-8, A14-12) print what
# they measured, so the flow reads the numbers; A14-3, A14-7 and A14-10 and the colours and fade of
# A14-2 are screenshots.
- openLink: ${APP_URL}/--/whats-new/0.14
- extendedWaitUntil:
    visible:
      id: whats-new-a14-1-toggle
    timeout: 30000
# A14-1: 2em follows the font size, 2rem stays 32, the icon with size="2em" is 2em (50vw is half the screen)
- scrollUntilVisible:
    element:
      id: whats-new-a14-1-toggle
    centerElement: true
- assertVisible: "Font 16 / 2em 32 / 2rem 32 / 50vw [0-9]+ / icon 32|Fuente 16 / 2em 32 / 2rem 32 / 50vw [0-9]+ / icono 32"
- tapOn:
    id: whats-new-a14-1-toggle
- assertVisible: "Font 24 / 2em 48 / 2rem 32 / 50vw [0-9]+ / icon 48|Fuente 24 / 2em 48 / 2rem 32 / 50vw [0-9]+ / icono 48"
- tapOn:
    id: whats-new-a14-1-toggle
- assertVisible: "Font 16 / 2em 32 / 2rem 32 / 50vw [0-9]+ / icon 32|Fuente 16 / 2em 32 / 2rem 32 / 50vw [0-9]+ / icono 32"
# A14-2: the fade is judged from the host-clock screenshot loop, not from this flow; one press starts it
- scrollUntilVisible:
    element:
      id: whats-new-a14-2-toggle
    centerElement: true
- tapOn:
    id: whats-new-a14-2-toggle
# A14-3: the borders are a screenshot (seagreen, not black, on Android)
- scrollUntilVisible:
    element:
      id: whats-new-a14-3-toggle
    centerElement: true
- tapOn:
    id: whats-new-a14-3-toggle
# A14-4 to A14-8: what each measured
- scrollUntilVisible:
    element:
      id: whats-new-a14-4-readout
    centerElement: true
- assertVisible: "Drawn: 200 x 100|Dibujado: 200 x 100"
- scrollUntilVisible:
    element:
      id: whats-new-a14-5-readout
    centerElement: true
- assertVisible: "Measured: height 80 / width 160 / box 36|Medido: alto 80 / ancho 160 / caja 36"
- scrollUntilVisible:
    element:
      id: whats-new-a14-6-readout
    centerElement: true
- assertVisible: "Line 1 item 80 / line 2 item 80 tall|Elemento de la línea 1: 80 / de la línea 2: 80 de alto"
# A14-7: one line, two lines, all of it (the line height differs by platform, so the three are ordered)
- scrollUntilVisible:
    element:
      id: whats-new-a14-7-readout
    centerElement: true
- assertVisible: "Heights: 19 / 38 / 57|Alturas: 22 / 40 / 59|Heights: 2[0-9] / [4-5][0-9] / [5-6][0-9]"
- scrollUntilVisible:
    element:
      id: whats-new-a14-8-readout
    centerElement: true
- assertVisible: "Heights: sheet 39 / Tailwind 39 / plain 19|Alturas: hoja 43 / Tailwind 43 / simple 22"
# A14-9: the accessibility tree says unchecked for "false" and checked for "true"
- scrollUntilVisible:
    element:
      id: whats-new-a14-9-false
    centerElement: true
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: whats-new-a14-9-false
          checked: false
      - assertVisible:
          id: whats-new-a14-9-true
          checked: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: whats-new-a14-9-false
          text: "checkbox, unchecked"
      - assertVisible:
          id: whats-new-a14-9-true
          text: "checkbox, checked"
# A14-10 is a screenshot. A14-11: a long press, held, is heard after about 500 ms
- scrollUntilVisible:
    element:
      id: whats-new-a14-11-hold
    centerElement: true
- assertVisible: "Rows drawn: 3|Filas dibujadas: 3"
- longPressOn:
    id: whats-new-a14-11-hold
- assertVisible: "Long press heard after [3-7]00 ms|Pulsación larga oída tras [3-7]00 ms"
# A14-12: padding 8 / 4, a 30 point line (the last card: no centring at the scroll's end)
- scrollUntilVisible:
    element:
      id: whats-new-a14-12-readout
- assertVisible: "Padding 8 / 4 / line 30|Padding 8 / 4 / línea 30"
