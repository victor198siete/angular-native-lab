# What's new demo, end to end in Expo Go, on iOS or Android, in English or Spanish:
#   iOS:     xcrun simctl terminate booted host.exp.Exponent, then
#            maestro test -e APP_ID=host.exp.Exponent -e APP_URL=exp://127.0.0.1:8081 .maestro/whats-new.yaml
#   Android: adb reverse tcp:8081 tcp:8081, then the same with APP_ID=host.exp.exponent
# Start with Expo Go closed: a link to the screen already showing does nothing, and the deep-link
# case below needs the app running when the second link arrives.
# Covers the interactive 0.10 cases: Dialogs.choose (Cancel resolves null, Save an index), the dark
# class on a root view, and a deep link pushed over the screen. The style cases (::ng-deep, border
# colour, one word, z-index) are visual: their screenshots are the evidence, Maestro cannot read them.
# The end of the file covers 0.13 (the icon readouts, the loader, the aria-label, and Back refused on a
# presented page on Android) and 0.11 (the two tab cases, in the tabs lab: Search behind a 4 s guard, and a
# tab bar moved from org 1 to org 2). The 0.13 and 0.11 drawings, and A11-1 (it leaves the app), are screenshots.
# The 0.7 cases come last (0.7 is the oldest section: the toolbar on iOS, a list that fills itself, a link to a url
# already on the stack, the line heights and the markdown); A7-4 and A7-6 are screenshots. The 0.6 cases follow the 0.7 ones.
appId: ${APP_ID}
---
- openLink: ${APP_URL}/--/whats-new
- extendedWaitUntil:
    visible: "What's new|Novedades|Continue|Close"
    timeout: 40000
# Expo Go's developer menu can open on a fresh install
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
# 1. The list of versions, and a row opens the 0.10 cases
- assertVisible:
    id: whats-new-heading
- tapOn:
    id: whats-new-version-0.10
- extendedWaitUntil:
    visible:
      id: whats-new-version-heading
    timeout: 20000
- assertVisible:
    id: whats-new-a10-1-status
# 2. Dialogs.choose: Cancel resolves null, Save the index 0
- scrollUntilVisible:
    element:
      id: whats-new-a10-1-open
    centerElement: true
- tapOn:
    id: whats-new-a10-1-open
- tapOn: "Cancel|Cancelar"
- assertVisible: "Resolved: null|Resuelto: null"
- tapOn:
    id: whats-new-a10-1-open
- tapOn: "Save|Guardar"
- assertVisible: "Resolved: 0|Resuelto: 0"
# 3. The dark class on the box itself
- scrollUntilVisible:
    element:
      id: whats-new-a10-4-toggle
    centerElement: true
- assertVisible: "dark class: off.*|clase dark: inactiva.*"
- tapOn:
    id: whats-new-a10-4-toggle
- assertVisible: "dark class: on.*|clase dark: activa.*"
- tapOn:
    id: whats-new-a10-4-toggle
- assertVisible: "dark class: off.*|clase dark: inactiva.*"
# 4. A link that arrives while the app runs is pushed over this screen; Back returns to it
- openLink: ${APP_URL}/--/device
- extendedWaitUntil:
    visible: "Your device, live|Tu dispositivo, en vivo"
    timeout: 30000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Version 0.10|Versión 0.10"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: whats-new-a10-4-toggle
    timeout: 20000
# 5. The 0.9 cases, opened by a link pushed over this screen (a link to the screen already showing does nothing)
- openLink: ${APP_URL}/--/whats-new/0.9
- extendedWaitUntil:
    visible:
      id: whats-new-a9-1-show
    timeout: 30000
# A9-1: the ICU sample is mounted on a press and, in Expo Go in development, throws while it renders:
# its texts never appear, so this flow does not assert them (the Vitest tests do).
# A9-2: both squares start from a press and stop at their own last frame
- scrollUntilVisible:
    element:
      id: whats-new-a9-2-toggle
    centerElement: true
- tapOn:
    id: whats-new-a9-2-toggle
- extendedWaitUntil:
    visible: "Reset|Reiniciar"
    timeout: 20000
# A9-3: each panel opens to the height set on it: 40, 96 and 64 points
- scrollUntilVisible:
    element:
      id: whats-new-a9-3-toggle
    centerElement: true
- tapOn:
    id: whats-new-a9-3-toggle
- extendedWaitUntil:
    visible: "Measured: 40 / 96 / 64|Medido: 40 / 96 / 64"
    timeout: 20000
# A9-4: after the fade, a press on the button still counts (iOS)
- scrollUntilVisible:
    element:
      id: whats-new-a9-4-count
    centerElement: true
- tapOn:
    id: whats-new-a9-4-fade
- extendedWaitUntil:
    visible: "Presses heard: 0 .faded.|Pulsaciones oídas: 0 .desvanecido."
    timeout: 20000
- tapOn:
    id: whats-new-a9-4-target
- assertVisible: "Presses heard: 1 .faded.|Pulsaciones oídas: 1 .desvanecido."
# A9-5: the cards mount through an @if (the last card: its button cannot be centred at the scroll's end)
- scrollUntilVisible:
    element:
      id: whats-new-a9-5-toggle
- tapOn:
    id: whats-new-a9-5-toggle
- extendedWaitUntil:
    visible:
      id: whats-new-a9-5-fast
    timeout: 20000
# 6. The 0.8 cases, opened by another pushed link
- openLink: ${APP_URL}/--/whats-new/0.8
- extendedWaitUntil:
    visible:
      id: whats-new-a8-1-check
    timeout: 30000
# A8-1: the permission is read with no dialog (Expo Go on the simulator has it granted or not; the
# Settings round trip needs simctl / adb and is in the README, not here)
- tapOn:
    id: whats-new-a8-1-check
- assertVisible: "Permission: .*|Permiso: .*"
# A8-2: the transitions are 10 s and are judged from a screen recording, not from this flow
# A8-3: padding and margin end at 20 after Open (a 2 s transition)
- scrollUntilVisible:
    element:
      id: whats-new-a8-3-toggle
    centerElement: true
- tapOn:
    id: whats-new-a8-3-toggle
- extendedWaitUntil:
    visible: "Padding 20 / margin 20"
    timeout: 20000
# A8-4: the middle stop moves with the buttons
- scrollUntilVisible:
    element:
      id: whats-new-a8-4-less
    centerElement: true
- tapOn:
    id: whats-new-a8-4-less
- tapOn:
    id: whats-new-a8-4-less
- assertVisible: "Middle stop at 10%|Parada intermedia en 10%"
# A8-5: the four icons are drawn at 18, 24, 24 and 16 points
- scrollUntilVisible:
    element:
      id: whats-new-a8-5-readout
    centerElement: true
- assertVisible: "Drawn: 18 / 24 / 24 / 16 points|Dibujados: 18 / 24 / 24 / 16 puntos"
# A8-6: the swatch follows the scheme (the last card: no centring at the scroll's end)
- scrollUntilVisible:
    element:
      id: whats-new-a8-6-readout
- assertVisible: "Scheme: light.*|Esquema: claro.*"
# 7. The 0.13 cases, opened by another pushed link
- openLink: ${APP_URL}/--/whats-new/0.13
- extendedWaitUntil:
    visible:
      id: whats-new-a13-2-next
    timeout: 30000
# A13-2: the pin follows --accent
- scrollUntilVisible:
    element:
      id: whats-new-a13-2-next
    centerElement: true
- tapOn:
    id: whats-new-a13-2-next
- assertVisible: "--accent is #0369a1|--accent es #0369a1"
# A13-3: the config gives 28 points, the icon's own size 44
- scrollUntilVisible:
    element:
      id: whats-new-a13-3-readout
    centerElement: true
- assertVisible: "Drawn: 28 / 44 points|Dibujados: 28 / 44 puntos"
# A13-4: the loader is asked once per name, and not again on a second draw
- scrollUntilVisible:
    element:
      id: whats-new-a13-4-draw
    centerElement: true
- tapOn:
    id: whats-new-a13-4-draw
- extendedWaitUntil:
    visible: "Loader asked 2 times: loaded-pin, loaded-ring|Cargador consultado 2 veces: loaded-pin, loaded-ring"
    timeout: 20000
- tapOn:
    id: whats-new-a13-4-clear
- tapOn:
    id: whats-new-a13-4-draw
- assertVisible: "Loader asked 2 times: loaded-pin, loaded-ring|Cargador consultado 2 veces: loaded-pin, loaded-ring"
# A13-5: the static aria-label is what a screen reader (and Maestro) finds
- scrollUntilVisible:
    element:
      id: whats-new-a13-5-labelled
    centerElement: true
- assertVisible: "Pin on the map"
# A13-6: 32 points from --ng-icon__size, 16 from the text
- scrollUntilVisible:
    element:
      id: whats-new-a13-6-readout
    centerElement: true
- assertVisible: "Drawn: 32 / 16 points|Dibujados: 32 / 16 puntos"
# A13-1 and A13-7 are drawings: their screenshots are the evidence
# A13-8: the lab is a pushed tab bar; on Android Back is refused on the presented page (the last card: no centring)
- scrollUntilVisible:
    element:
      id: whats-new-a13-8-open
- tapOn:
    id: whats-new-a13-8-open
- extendedWaitUntil:
    visible:
      id: whats-new-lab-present
    timeout: 20000
- tapOn:
    id: whats-new-lab-present
- extendedWaitUntil:
    visible: "Album guarded"
    timeout: 20000
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - assertVisible: "Back refused: 1"
- tapOn:
    id: whats-new-lab-album-close
- extendedWaitUntil:
    visible:
      id: whats-new-lab-leave
    timeout: 20000
- tapOn:
    id: whats-new-lab-leave
- extendedWaitUntil:
    visible:
      id: whats-new-a13-8-open
    timeout: 20000
# 8. The 0.11 cases: the two tab cases run in the lab
- openLink: ${APP_URL}/--/whats-new/0.11
- extendedWaitUntil:
    visible:
      id: whats-new-a11-1-open
    timeout: 30000
# A11-1 opens the system Settings and leaves the app: the Vitest test and the README cover it
- scrollUntilVisible:
    element:
      id: whats-new-a11-2-open
    centerElement: true
- tapOn:
    id: whats-new-a11-2-open
- extendedWaitUntil:
    visible:
      id: whats-new-lab-home-title
    timeout: 20000
# A11-2: Search waits 4 s behind a guard; a tap on Home at once keeps Home in front
- tapOn: "Search"
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Tabs lab: Search"
    timeout: 6500
    optional: true
- assertNotVisible: "Tabs lab: Search"
- assertVisible: "url: /whats-new/tabs/1/home"
# A11-3: the url of a tab goes to the account in front (the page left behind in the stack is the caveat)
- tapOn: "Library"
- tapOn:
    id: whats-new-lab-open-x
- extendedWaitUntil:
    visible:
      id: whats-new-lab-album-title
    timeout: 10000
- tapOn: "Home"
- tapOn:
    id: whats-new-lab-org
- extendedWaitUntil:
    visible: "org: 2"
    timeout: 10000
- tapOn: "Library"
- extendedWaitUntil:
    visible: "url: /whats-new/tabs/2/library"
    timeout: 10000
# 9. The 0.14 cases, opened by another pushed link. The layout cases (A14-4 to A14-8, A14-12) print what
# they measured, so the flow reads the numbers; A14-3, A14-7 and A14-10 and the colours and fade of
# A14-2 are screenshots.
- openLink: ${APP_URL}/--/whats-new/0.14
- extendedWaitUntil:
    visible:
      id: whats-new-a14-1-toggle
    timeout: 30000
# A14-1: 2em follows the font size, 2rem stays 32, the icon with size="2em" is 2em (50vw is half the screen)
- scrollUntilVisible:
    element:
      id: whats-new-a14-1-toggle
    centerElement: true
- assertVisible: "Font 16 / 2em 32 / 2rem 32 / 50vw [0-9]+ / icon 32|Fuente 16 / 2em 32 / 2rem 32 / 50vw [0-9]+ / icono 32"
- tapOn:
    id: whats-new-a14-1-toggle
- assertVisible: "Font 24 / 2em 48 / 2rem 32 / 50vw [0-9]+ / icon 48|Fuente 24 / 2em 48 / 2rem 32 / 50vw [0-9]+ / icono 48"
- tapOn:
    id: whats-new-a14-1-toggle
- assertVisible: "Font 16 / 2em 32 / 2rem 32 / 50vw [0-9]+ / icon 32|Fuente 16 / 2em 32 / 2rem 32 / 50vw [0-9]+ / icono 32"
# A14-2: the fade is judged from the host-clock screenshot loop, not from this flow; one press starts it
- scrollUntilVisible:
    element:
      id: whats-new-a14-2-toggle
    centerElement: true
- tapOn:
    id: whats-new-a14-2-toggle
# A14-3: the borders are a screenshot (seagreen, not black, on Android)
- scrollUntilVisible:
    element:
      id: whats-new-a14-3-toggle
    centerElement: true
- tapOn:
    id: whats-new-a14-3-toggle
# A14-4 to A14-8: what each measured
- scrollUntilVisible:
    element:
      id: whats-new-a14-4-readout
    centerElement: true
- assertVisible: "Drawn: 200 x 100|Dibujado: 200 x 100"
- scrollUntilVisible:
    element:
      id: whats-new-a14-5-readout
    centerElement: true
- assertVisible: "Measured: height 80 / width 160 / box 36|Medido: alto 80 / ancho 160 / caja 36"
- scrollUntilVisible:
    element:
      id: whats-new-a14-6-readout
    centerElement: true
- assertVisible: "Line 1 item 80 / line 2 item 80 tall|Elemento de la línea 1: 80 / de la línea 2: 80 de alto"
# A14-7: one line, two lines, all of it (the line height differs by platform, so the three are ordered)
- scrollUntilVisible:
    element:
      id: whats-new-a14-7-readout
    centerElement: true
- assertVisible: "Heights: 19 / 38 / 57|Alturas: 19 / 38 / 57|Alturas: 22 / 40 / 59|Heights: 2[0-9] / [4-5][0-9] / [5-6][0-9]"
- scrollUntilVisible:
    element:
      id: whats-new-a14-8-readout
    centerElement: true
- assertVisible: "Heights: sheet 39 / Tailwind 39 / plain 19|Alturas: hoja 39 / Tailwind 39 / simple 19|Alturas: hoja 43 / Tailwind 43 / simple 22"
# A14-9: the accessibility tree says unchecked for "false" and checked for "true"
- scrollUntilVisible:
    element:
      id: whats-new-a14-9-false
    centerElement: true
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible:
          id: whats-new-a14-9-false
          checked: false
      - assertVisible:
          id: whats-new-a14-9-true
          checked: true
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: whats-new-a14-9-false
          text: "checkbox, unchecked"
      - assertVisible:
          id: whats-new-a14-9-true
          text: "checkbox, checked"
# A14-10 is a screenshot. A14-11: a long press, held, is heard after about 500 ms
- scrollUntilVisible:
    element:
      id: whats-new-a14-11-hold
    centerElement: true
- assertVisible: "Rows drawn: 3|Filas dibujadas: 3"
- longPressOn:
    id: whats-new-a14-11-hold
- assertVisible: "Long press heard after [3-7]00 ms|Pulsación larga oída tras [3-7]00 ms"
# A14-12: padding 8 / 4, a 30 point line (the last card: no centring at the scroll's end)
- scrollUntilVisible:
    element:
      id: whats-new-a14-12-readout
- assertVisible: "Padding 8 / 4 / line 30|Padding 8 / 4 / línea 30"
# 10. The 0.7 cases, opened by another pushed link
- openLink: ${APP_URL}/--/whats-new/0.7
- extendedWaitUntil:
    visible:
      id: whats-new-a7-1-readout
    timeout: 30000
# A7-1: the readout starts at zero. On iOS the toolbar draws its two buttons and each press is counted; on Android
# nothing is drawn, so there is nothing to press
- assertVisible: "Plus pressed 0 times, Clear 0 times|Más pulsado 0 veces, Borrar 0 veces"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Add|Añadir"
      - tapOn: "Add|Añadir"
      - tapOn: "Clear|Borrar"
      - tapOn: "Add|Añadir"
      - assertVisible: "Plus pressed 1 times, Clear 1 times|Más pulsado 1 veces, Borrar 1 veces"
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible: "Add|Añadir"
# A7-2: three rows are shorter than the list, and with no drag it fills itself to 12 rows and fires 4 times
- scrollUntilVisible:
    element:
      id: whats-new-a7-2-again
    centerElement: true
- tapOn:
    id: whats-new-a7-2-again
- extendedWaitUntil:
    visible: "Rows 12 / endReached 4 times.*|Filas 12 / endReached 4 veces.*"
    timeout: 20000
# A7-3: Page B links back to the 0.7 page under it: a second copy opens over Page B, and Back returns to Page B
- scrollUntilVisible:
    element:
      id: whats-new-a7-3-open
    centerElement: true
- assertVisible: "Copies of this page on the stack: 1|Copias de esta página en la pila: 1"
- tapOn:
    id: whats-new-a7-3-open
- extendedWaitUntil:
    visible: "Copies of Page B: 1 / of the 0.7 page: 1|Copias de la Página B: 1 / de la página 0.7: 1"
    timeout: 20000
- tapOn:
    id: whats-new-link-lab-back
- scrollUntilVisible:
    element:
      id: whats-new-a7-3-open
    centerElement: true
- assertVisible: "Copies of this page on the stack: 2|Copias de esta página en la pila: 2"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Page B|Página B"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: "Copies of Page B: 1 / of the 0.7 page: 1|Copias de la Página B: 1 / de la página 0.7: 1"
    timeout: 20000
# The replaceUrl link swaps Page B for a new one: still one copy of each
- tapOn:
    id: whats-new-link-lab-replace
- assertVisible: "Copies of Page B: 1 / of the 0.7 page: 1|Copias de la Página B: 1 / de la página 0.7: 1"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Version 0.7|Versión 0.7"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- extendedWaitUntil:
    visible: "Copies of this page on the stack: 1|Copias de esta página en la pila: 1"
    timeout: 20000
# A7-4: one press starts the fades; the easing is judged from the host-clock screenshot loop
- scrollUntilVisible:
    element:
      id: whats-new-a7-4-toggle
    centerElement: true
- tapOn:
    id: whats-new-a7-4-toggle
# A7-5: the unitless 2 is inherited as the number: 3 lines of 40 is 120, the fixed 20 gives about 60
- scrollUntilVisible:
    element:
      id: whats-new-a7-5-readout
    centerElement: true
- assertVisible: "Heights: unitless 120 / fixed 6[01]|Alturas: sin unidad 120 / fija 6[01]"
# A7-6 is a screenshot (the last card: no centring at the scroll's end)
- scrollUntilVisible:
    element:
      id: whats-new-a7-6-drawn
- assertVisible: ".*hard-wrapped in the source reads as one line.*"
# 11. The 0.6 cases, opened by another pushed link. The list of A6-5 is 45% wide so a swipe that starts in the middle of the
# screen never lands on it; A6-6 (the fades through a blocked thread) and A6-7 (the shapes) are screenshots.
- openLink: ${APP_URL}/--/whats-new/0.6
- extendedWaitUntil:
    visible:
      id: whats-new-a6-1-hide
    timeout: 30000
# A6-1: after Hide and Show the display: none box starts at row 1 again and was laid out twice; the opacity box is still at row 11
- tapOn:
    id: whats-new-a6-1-scroll
- tapOn:
    id: whats-new-a6-1-hide
- tapOn:
    id: whats-new-a6-1-hide
- assertVisible: "Laid out: display none 2 times / opacity 1 times|Dispuesto: display none 2 veces / opacity 1 veces"
- assertVisible: "Row 1|Fila 1"
- assertVisible: "Row 11|Fila 11"
# A6-2: the link of the imported .md reports its url (and does not leave for a browser)
- scrollUntilVisible:
    element:
      id: whats-new-a6-2-readout
    centerElement: true
- tapOn: "the release notes"
- assertVisible: "Link pressed: https://github.com/ng-native/ng-native/releases|Enlace pulsado: https://github.com/ng-native/ng-native/releases"
# A6-3: rows 1, 3 and 5 are 38, 78 and 118 points tall
- scrollUntilVisible:
    element:
      id: whats-new-a6-3-readout
    centerElement: true
- assertVisible: "Heights: rows 1 38 / rows 3 78 / rows 5 118|Alturas: rows 1 38 / rows 3 78 / rows 5 118"
# A6-4: the bar goes from 100% to 60% of its track and back
- scrollUntilVisible:
    element:
      id: whats-new-a6-4-toggle
    centerElement: true
- assertVisible: "Bar [0-9]+ of [0-9]+ points .100%.|Barra [0-9]+ de [0-9]+ puntos .100%."
- tapOn:
    id: whats-new-a6-4-toggle
- assertVisible: "Bar [0-9]+ of [0-9]+ points .60%.|Barra [0-9]+ de [0-9]+ puntos .60%."
- tapOn:
    id: whats-new-a6-4-toggle
- assertVisible: "Bar [0-9]+ of [0-9]+ points .100%.|Barra [0-9]+ de [0-9]+ puntos .100%."
# A6-5: the list opens with a header and a footer (on Android it stopped the app); Scroll to the footer moves it
- scrollUntilVisible:
    element:
      id: whats-new-a6-5-end
    centerElement: true
- assertVisible: "Scrolled 0 points|Desplazado 0 puntos"
- tapOn:
    id: whats-new-a6-5-end
- assertVisible: "Scrolled [1-9][0-9]* points|Desplazado [1-9][0-9]* puntos"
# A6-6: one press starts the squares and the block; the fades are judged from the host-clock screenshot loop
- scrollUntilVisible:
    element:
      id: whats-new-a6-6-both
    centerElement: true
- tapOn:
    id: whats-new-a6-6-both
# A6-7 is a screenshot, with its measured margin: the green box at x 24 and y 0
- scrollUntilVisible:
    element:
      id: whats-new-a6-7-readout
    centerElement: true
- assertVisible: "Green box at x 24 / y 0|Caja verde en x 24 / y 0"
# A6-8: a press anywhere on the invisible backdrop counts for it and not for the button under it
- scrollUntilVisible:
    element:
      id: whats-new-a6-8-reset
    centerElement: true
# the swipe that centred the card can still be coasting: wait for it to stop before pressing
- waitForAnimationToEnd
- tapOn:
    id: whats-new-a6-8-backdrop
- tapOn:
    id: whats-new-a6-8-backdrop
- assertVisible: "Backdrop heard 2 / button heard 0|El fondo oyó 2 / el botón oyó 0"
# A6-9: the scheme and the share (the last card: no centring at the scroll's end)
- scrollUntilVisible:
    element:
      id: whats-new-a6-9-more
- tapOn:
    id: whats-new-a6-9-more
- assertVisible: "Scheme: light, share 60%|Esquema: claro, parte 60%"
- tapOn:
    id: whats-new-a6-9-toggle
- assertVisible: "Scheme: dark, share 60%|Esquema: oscuro, parte 60%"
- tapOn:
    id: whats-new-a6-9-toggle
- assertVisible: "Scheme: light, share 60%|Esquema: claro, parte 60%"
