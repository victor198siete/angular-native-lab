name: CI

# Everything here runs in Node against ng-native's fake native layer: no simulator, no device.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Builds the Tailwind sheet (node metro.config.js) and type-checks templates with ngc.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Translations match the extracted messages
        run: npm run i18n:check
